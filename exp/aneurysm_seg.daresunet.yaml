LOSS:
  CLASS_WEIGHT: [1.0, 5.0]
  IGNORE_INDEX: -100
  TYPE: ML:ce_loss+dice_loss
  WEIGHT: [1.0, 1.0]
METRICS: ['Dice', 'Loss', 'F1-Score', 'Recall', 'Precision']
MODEL:
  ADD_COORDS: False
  BACKBONE:
    ARCH: resnet34
    HEAD: A
  BN: bn
  DEEP_SUPERVISION: False
  DIM: 3d
  INPUT_CHANNEL: 1
  NAME: datacat_refine_multi_add
  NCLASS: 2
  PRETRAIN: 
  USE_MULTI_WWWL: False
OUTPUT_DIR: ./exp/
SAVE_ALL: True
SEED: 1234
SOLVER:
  BASE_LR: 0.0001
  DECAY_ITER: 1
  EPOCHS: 300
  GROUP_EPOCH: 7
  GROUP_EPOCH_DATA: 7
  LR_MODE: poly
  OPTIMIZER:
    BETAS: (0.9, 0.99)
    TYPE: adam
    WEIGHT_DECAY: 0.0001
  START_EPOCHS: 0
TASK:
  NAME: aneurysm_seg
  STATUS: train
  TYPE: 1
TEST:
  DATA:
    BATCH_SIZE: 8
    ENHANCED_FOLDER: ./dataset/with_skull/dicom2nifti_enhanced_v2/
    NII_FOLDER: ./raws/image
    PATCH_SIZE: (80, 80, 80)
    TEST_FILE: ./raws/part_test.txt
    TEST_LIST: []
    TEST_NUM_USE: -1
    WORKERS: 16
  MODEL_PTH: ./best_model/da_resunet.pth.tar
  SAVE: True
  SAVE_DIR: raws/output
TRAIN:
  DATA:
    ANEURYSM_BBOX: ./dataset/without_skull/lesion_bbox.txt
    ANEURYSM_FOLDER: ./dataset/without_skull/mask/
    BATCH_SIZE: 3
    ENHANCED_FOLDER: ./dataset/with_skull/dicom2nifti_enhanced_v2/
    IS_ENHANCED: 1
    NII_FOLDER: ./dataset/without_skull/image/
    PATCH_OFFSET: (2, 2, 2)
    PATCH_SIZE: (80, 80, 80)
    TRAIN_LIST: ./dataset/without_skull/train.txt
    TRAIN_NUM_USE: -1
    VAL_LIST: ./dataset/without_skull/valid.txt
    VAL_NUM_USE: -1
    WL_WW: (450, 900)
    WORKERS: 16
  PRINT: 100
  RESUME: False
  START_VALIDATE: 0
  VALIDATE_FREQUENCE: 500